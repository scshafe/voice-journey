# The stack's data (stack.toml, schema 1). The host's tools/stack reads it as
# data, never as shell, and rejects an unknown key; `dev check` (DEPLOY-03)
# checks the same schema. Secrets are named here and never valued: the owner's
# provisioning places them on the host.
#
# CUTOVER STATE: the stack is the sidecar, the door and the 308 responder to
# voice-lab (compose.yaml). The app no longer mounts the data root, so the
# backup keeps only the node identity and .env; the data under
# /srv/voice-journey stays on the laptop untouched (voice-lab
# docs/design/VOICE-PLATFORM.md section 5.6 step 6). Infra's
# stacks/voice-journey/host.conf still grants the data binds and the vj-mirror
# group; nothing uses them now.
schema = 1

[deploy]
image = "voice-journey"              # the image built from this repository's Dockerfile (the responder)
pin = "VOICE_JOURNEY_IMAGE"          # the .env variable stack deploy writes (name:tag)
pin_style = "ref"
dockerfile = "Dockerfile"
containers = ["voice-journey"]       # all must be ready on the candidate
health = "/healthz"                  # probed through the door at the tailnet name
ready_attempts = 20
rollback_services = ["app"]          # never the sidecar (the node identity) or the door
# No build secret: the image is the Python standard library and one file.
build_secrets = []

[check]
required_health_services = ["app"]

[backup]
tailscale = true                     # the node identity (always, with a sidecar)
paths = [".env"]                     # the door's client and cookie secrets
keep_min = 3
retention_days = 7

[env]
required = ["TS_AUTHKEY", "OIDC_CLIENT_ID", "OIDC_CLIENT_SECRET", "ID_TAILNET_IP"]
generated = ["OAUTH2_PROXY_COOKIE_SECRET"]
owner = []
