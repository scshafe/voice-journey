# voice-journey on the tailnet as its own machine, `voice-journey`, at
# https://voice-journey.<tailnet>/ (tailnet only; never Funnel). CUTOVER STATE:
# Voice Journey moved to voice-lab (scshafe/voice-lab, docs/design/
# VOICE-PLATFORM.md section 5.6 step 5, D-032). For 90 days after the cutover
# this stack only keeps the owner's bookmarks working: every request is
# answered `308 Permanent Redirect` to the same path and query on
# https://voice-lab.<tailnet>/. It serves no data, mounts no data and reads
# nothing; then the stack, its runner and infra's stacks/voice-journey/ go
# (section 5.6 step 6, section 5.7). An app-owned stack (scshafe infra
# docs/platform/agent-deploy.md): a merge to main deploys it through the
# runner lane; nobody runs `docker compose` on it by hand.
#
# The host's tools/stack validates this file against an allowlist before
# anything runs: no privileges, no host namespaces, binds only under ./state or
# the host paths infra's stacks/voice-journey/host.conf grants, images either
# built here (through the pin) or pinned by digest. `dev check` runs the same
# validator (DEPLOY-04).
#
# The door stays: infra's host.conf says DOOR=pocket-id, and with it the
# validator requires exactly this layout and one oauth2-proxy (V-11). Every
# route skips authentication (OAUTH2_PROXY_SKIP_AUTH_ROUTES "^/"), so the door
# only forwards to the responder; oauth2-proxy still answers its own paths
# (/oauth2/*, /ping, /ready, /robots.txt) itself. It still needs Pocket ID's
# discovery to start, so the voice-journey Pocket ID client and the door's
# secrets stay until the stack retires.
#
# Topology (exact addresses are authority; the door layout, V-11):
#   door      internal /29   ts-voice-journey .2 -> oauth2-proxy .3:4180 (serve.json)
#   upstream  internal /29   oauth2-proxy .10 -> responder .11:8787
#   egress    bridge         ts-voice-journey (control, DERP, ACME),
#                            oauth2-proxy (Pocket ID discovery)
# The responder is on `upstream` only: no egress, no host port. The sidecar
# (its service, container name and state/tailscale, the node identity) is
# unchanged from the app's stack, so the deploy replaces the door and the app
# in place and the node keeps its name.
# The deploy witness is /healthz THROUGH the door (the responder answers it
# with {"ok":true}; every other path is a 308).
name: voice-journey

networks:
  door:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.253.86.0/29
  upstream:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.253.86.8/29
  egress:
    driver: bridge

services:
  # --- the door ------------------------------------------------------------------
  ts-voice-journey:
    # tailscale/tailscale:v1.102.2 (the tag this node ran before the move),
    # multi-arch index digest
    image: tailscale/tailscale:v1.102.2@sha256:321ce041508c19079b57a28b6666c8d81ab0b08accc0a2585b3ab663d557ac24
    container_name: ts-voice-journey
    # docker-init as PID 1: containerboot waits only on tailscaled, so orphans
    # an exec leaves behind would stay zombies.
    init: true
    restart: unless-stopped
    environment:
      TS_HOSTNAME: voice-journey
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTHKEY: ${TS_AUTHKEY:-}      # consumed on the first join only; state/tailscale is the identity
    # Public resolvers, NOT 100.100.100.100: quad-100 SERVFAILs public names
    # here and ACME renewal would die silently (STUDY-GUIDE case study #4).
    dns: [1.1.1.1, 1.0.0.1]
    volumes:
      - ./state/tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    networks:
      door:
        ipv4_address: 10.253.86.2
      egress: {}
    # Userspace tailscale needs no NET_ADMIN or NET_RAW; without NET_RAW this
    # peer cannot spoof the proxy's address on the door network. Every default
    # capability is dropped except DAC_OVERRIDE: root here must still open
    # ./state/tailscale, which the host's stack tool keeps cole-owned at 0700
    # (cap_add is refused by the validator, V-03, so the set is spelled out).
    cap_drop:
      - AUDIT_WRITE
      - CHOWN
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    security_opt: [no-new-privileges:true]

  oauth2-proxy:
    # quay.io/oauth2-proxy/oauth2-proxy:v7.15.3 (the tag the door ran before
    # the move), multi-arch index digest
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
    container_name: voice-journey-oauth2-proxy
    restart: unless-stopped
    user: "65532:65532"  # the image's own nonroot user, spelled out
    depends_on: [ts-voice-journey]
    # Flag, not env: --trusted-proxy-ip has no env mapping. The exact peer is
    # the sidecar on the door network.
    command: ["--trusted-proxy-ip=10.253.86.2/32"]
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: "Pocket ID"
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://id.colobus-stargazer.ts.net
      # The voice-journey Pocket ID client (confidential, PKCE).
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://voice-journey.colobus-stargazer.ts.net/oauth2/callback
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"   # who may sign in = the client's allowed groups in Pocket ID
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 12h
      OAUTH2_PROXY_HTTP_ADDRESS: 10.253.86.3:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_UPSTREAMS: http://10.253.86.11:8787
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # The cutover: every method and path goes to the responder without a
      # session (it serves no data; its only answers are a 308 to voice-lab and
      # /healthz). The deploy witness, /healthz, is among them.
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "^/"
      # Strip caller-supplied identity headers on the skipped routes (the
      # responder ignores every header anyway); never manufacture a Basic
      # credential.
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_PASS_BASIC_AUTH: "false"
      OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS: "true"
      # Sign-out's rd= chain to Pocket ID's end-session works only for a
      # whitelisted host (and tools/stack check asks for it on every door).
      OAUTH2_PROXY_WHITELIST_DOMAINS: id.colobus-stargazer.ts.net
    dns: [1.1.1.1, 1.0.0.1]
    extra_hosts:
      # OIDC discovery and JWKS go to the id node over the host's tailnet; the
      # name is pinned because the public resolver cannot answer it.
      - "id.colobus-stargazer.ts.net:${ID_TAILNET_IP:?set ID_TAILNET_IP (the id node's tailscale IP) in .env}"
    networks:
      door:
        ipv4_address: 10.253.86.3
      upstream:
        ipv4_address: 10.253.86.10
      egress: {}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # --- the responder (the pinned image) ---------------------------------------------
  # The service keeps its name `app` and container name `voice-journey`, so the
  # deploy replaces the old app container in place (same compose project).
  app:
    # Built by the host from this repository's Dockerfile (redirect/responder.py
    # on a digest-pinned python:3.12-alpine) at the merged commit and pinned in
    # the runtime .env by the deploy.
    image: ${VOICE_JOURNEY_IMAGE}
    container_name: voice-journey
    restart: unless-stopped
    depends_on: [oauth2-proxy]
    user: "65534:65534"  # nobody: it owns nothing and reads nothing
    # docker-init as PID 1 (signals, zombies); the responder also stops on SIGTERM.
    init: true
    environment:
      # The redirect target: the Location is always this origin + the request's
      # path and query (never the request's Host).
      REDIRECT_ORIGIN: https://voice-lab.colobus-stargazer.ts.net
      # Listen on the upstream address (the door's only way in) and loopback
      # (the container's own healthcheck); nothing else.
      REDIRECT_HOST: 10.253.86.11,127.0.0.1
      REDIRECT_PORT: "8787"
    # No volumes: no data root, no phone corpus, no group_add. No egress: the
    # internal upstream network only.
    networks:
      upstream:
        ipv4_address: 10.253.86.11
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python3", "-B", "/app/responder.py", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
